<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR — Virich Surface</title>

  <!-- Local copies — upload these files to your repo -->
  <script src="aframe.min.js"></script>
  <script src="aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #ui {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    #ui.found { background: rgba(0,160,60,0.7); }
  </style>
</head>
<body>

<div id="ui">Наведи камеру на маркер ▼</div>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  vr-mode-ui="enabled: false">

  <a-entity camera></a-entity>

  <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="2">
    <a-entity virich-surface></a-entity>
  </a-marker>

</a-scene>

<script>
/* ═══════════════════════════════════════════
   VIRICH SURFACE — A-Frame component
═══════════════════════════════════════════ */
function f_func(v,a,b){
  return (a*b)/Math.sqrt(a*a*Math.sin(v)*Math.sin(v)+b*b*Math.cos(v)*Math.cos(v));
}
function parametric(u,v,a,b,c,d){
  let fv=f_func(v,a,b);
  let x=0.5*(fv*(1+Math.cos(u))+(d*d-c*c)*(1-Math.cos(u))/fv)*Math.cos(v);
  let y=0.5*(fv*(1+Math.cos(u))+(d*d-c*c)*(1-Math.cos(u))/fv)*Math.sin(v);
  let z=0.5*(fv-(d*d-c*c)/fv)*Math.sin(u);
  return [x,y,z];
}
function calcNormal(u,v,a,b,c,d){
  let eps=0.01;
  let p=parametric(u,v,a,b,c,d);
  let pu=parametric(u+eps,v,a,b,c,d);
  let pv=parametric(u,v+eps,a,b,c,d);
  let du=[pu[0]-p[0],pu[1]-p[1],pu[2]-p[2]];
  let dv=[pv[0]-p[0],pv[1]-p[1],pv[2]-p[2]];
  let nx=du[1]*dv[2]-du[2]*dv[1];
  let ny=du[2]*dv[0]-du[0]*dv[2];
  let nz=du[0]*dv[1]-du[1]*dv[0];
  let L=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
  return [nx/L,ny/L,nz/L];
}

AFRAME.registerComponent('virich-surface', {
  init: function(){
    const U=40, V=40, a=2, b=1, c=0.5, d=1.2, S=0.04;
    let positions=[], normals=[], indices=[];

    for(let j=0;j<=V;j++){
      let v=2*Math.PI*j/V;
      for(let i=0;i<=U;i++){
        let u=2*Math.PI*i/U;
        let p=parametric(u,v,a,b,c,d);
        let n=calcNormal(u,v,a,b,c,d);
        positions.push(p[0]*S, p[2]*S, -p[1]*S);
        normals.push(n[0], n[2], -n[1]);
      }
    }
    let row=U+1;
    for(let j=0;j<V;j++)
      for(let i=0;i<U;i++){
        let p0=j*row+i,p1=p0+1,p2=p0+row,p3=p2+1;
        indices.push(p0,p2,p1, p1,p2,p3);
      }

    let geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute('normal',  new THREE.Float32BufferAttribute(normals,3));
    geo.setIndex(indices);

    let mat=new THREE.MeshPhongMaterial({
      color:0x3399ff, emissive:0x112244, shininess:80,
      side:THREE.DoubleSide, transparent:true, opacity:0.9
    });
    this.el.setObject3D('mesh', new THREE.Mesh(geo,mat));

    // Wireframe
    let pts=[];
    for(let j=0;j<=V;j++){
      pts[j]=[];
      let v=2*Math.PI*j/V;
      for(let i=0;i<=U;i++){
        let u=2*Math.PI*i/U;
        let p=parametric(u,v,a,b,c,d);
        pts[j][i]=[p[0]*S,p[2]*S,-p[1]*S];
      }
    }
    let wpos=[];
    for(let j=0;j<=V;j++)
      for(let i=0;i<U;i++)
        wpos.push(...pts[j][i],...pts[j][i+1]);
    for(let i=0;i<=U;i++)
      for(let j=0;j<V;j++)
        wpos.push(...pts[j][i],...pts[j+1][i]);

    let wgeo=new THREE.BufferGeometry();
    wgeo.setAttribute('position',new THREE.Float32BufferAttribute(wpos,3));
    let wire=new THREE.LineSegments(wgeo,
      new THREE.LineBasicMaterial({color:0x00eeff,transparent:true,opacity:0.7}));
    this.el.setObject3D('wireframe',wire);

    // Lights
    this.el.sceneEl.object3D.add(new THREE.AmbientLight(0xffffff,0.5));
    let dir=new THREE.DirectionalLight(0xffffff,0.9);
    dir.position.set(1,2,1);
    this.el.sceneEl.object3D.add(dir);
  }
});

// Marker events
const marker = document.querySelector('a-marker');
const ui = document.getElementById('ui');
marker.addEventListener('markerFound', ()=>{
  ui.textContent='✓ Маркер знайдено!';
  ui.classList.add('found');
});
marker.addEventListener('markerLost', ()=>{
  ui.textContent='Наведи камеру на маркер ▼';
  ui.classList.remove('found');
});
</script>
</body>
</html>
